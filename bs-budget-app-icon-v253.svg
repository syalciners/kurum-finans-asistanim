<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BS Ofis Bütçe Yönetimi</title>
  <desc id="desc">Beyaz zemin üzerinde krom gümüş ve elektrik mavisi BS bütçe uygulama ikonu, yükselen grafik ve finans büyüme yayı.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#EEF4FC"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#F7FAFD"/>
      <stop offset=".46" stop-color="#D6DEE8"/>
      <stop offset=".66" stop-color="#FFFFFF"/>
      <stop offset=".84" stop-color="#AEBBCB"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62D4FF"/>
      <stop offset=".28" stop-color="#1D9CFF"/>
      <stop offset=".58" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#102E7A"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1748B5"/>
      <stop offset=".38" stop-color="#25B9FF"/>
      <stop offset=".7" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F2E78"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1E3A8A" flood-opacity=".14"/>
    </filter>
    <filter id="metalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0F2E78" flood-opacity=".24"/>
    </filter>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#D7E2EF" stroke-width="3"/>
    <path d="M79 83C169 48 336 50 433 89" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity=".9"/>
  </g>

  <g filter="url(#metalShadow)">
    <text x="60" y="327" fill="url(#chrome)" stroke="#184DAE" stroke-width="8" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="246" font-weight="900" letter-spacing="-30">BS</text>
    <text x="60" y="321" fill="url(#chrome)" stroke="#75D9FF" stroke-width="2" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="246" font-weight="900" letter-spacing="-30" opacity=".92">BS</text>
  </g>

  <path d="M91 361C169 402 267 409 352 378c44-16 77-41 104-74" fill="none" stroke="#0E2C75" stroke-opacity=".28" stroke-width="23" stroke-linecap="round"/>
  <path d="M88 353C167 392 264 399 345 370c43-15 77-39 106-73" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round" filter="url(#blueGlow)"/>
  <path d="M91 346C169 382 257 389 332 365" fill="none" stroke="#FFFFFF" stroke-opacity=".92" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#metalShadow)" fill="url(#chrome)" stroke="#1749A8" stroke-width="3">
    <path d="M302 337h34v74h-34z"/>
    <path d="M348 304h34v107h-34z"/>
    <path d="M394 258h34v153h-34z"/>
  </g>
  <g fill="none" stroke="#70D8FF" stroke-width="1.5" opacity=".85">
    <path d="M305 340h28"/><path d="M351 307h28"/><path d="M397 261h28"/>
  </g>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#73B5FF" stroke-width="3" opacity=".55"/>
  <path d="M97 421C180 451 331 452 419 411" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".42"/>
</svg>