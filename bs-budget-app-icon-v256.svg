<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BS Ofis Bütçe Yönetimi</title>
  <desc id="desc">Derin lacivert zemin üzerinde belirgin BS monogramı ve tek yükselen mavi finans kavisi.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#102B54"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7CED7"/>
      <stop offset="0.52" stop-color="#B8C1CC"/>
      <stop offset="1" stop-color="#9FAAB7"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D6EFD"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#navy)"/>
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="#173A67" stroke-width="3"/>

  <!-- Geometrik B: iki goz de belirgin, kucuk boyutta P gibi algilanmaz. -->
  <path fill="#F8FAFC" fill-rule="evenodd" d="M82 86H208C258 86 286 111 286 151C286 181 269 203 239 212C275 222 296 248 296 283C296 330 263 357 210 357H82V86ZM128 126V194H198C224 194 239 183 239 160C239 137 224 126 198 126H128ZM128 232V316H204C234 316 249 301 249 274C249 247 233 232 204 232H128Z"/>

  <!-- S: saten gumus, beyaz zeminde de kaybolmayacak orta ton kontrasti. -->
  <path fill="url(#silver)" d="M421 122C385 94 329 88 290 104C250 121 232 151 240 185C248 218 277 233 319 244L350 252C372 258 383 270 379 285C375 304 351 317 320 315C289 313 260 302 236 283L211 325C240 351 278 368 319 371C374 375 421 349 431 306C442 259 412 227 361 214L326 205C304 199 292 189 294 175C297 158 319 147 346 149C370 151 389 159 406 172L421 122Z"/>

  <!-- Tek finans imzasi: sade, yukselen kavis. -->
  <path d="M58 382C131 360 176 313 225 248C278 178 331 131 432 111" fill="none" stroke="url(#growth)" stroke-width="25" stroke-linecap="round"/>
  <path d="M62 374C134 351 177 307 225 244C276 178 328 135 424 116" fill="none" stroke="#6CC7FF" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
</svg>
