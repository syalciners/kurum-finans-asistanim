<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">BS Ofis Bütçe Yönetimi</title>
  <desc id="desc">Açık zeminlerde kullanılmak üzere mavi gümüş yatay BS Ofis Bütçe Yönetimi logosu.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1788F7"/>
      <stop offset=".55" stop-color="#0A5DD2"/>
      <stop offset="1" stop-color="#173A8A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#EAF1F8"/>
      <stop offset=".76" stop-color="#AEBFD2"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#173A8A" flood-opacity=".16"/>
    </filter>
  </defs>

  <g transform="translate(18 18)" filter="url(#soft)">
    <rect x="0" y="0" width="210" height="210" rx="48" fill="url(#blue)"/>
    <rect x="7" y="7" width="196" height="196" rx="43" fill="none" stroke="#75E4FF" stroke-opacity=".72" stroke-width="3"/>
    <text x="20" y="137" fill="url(#silver)" stroke="#0A4FC5" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-12">BS</text>
    <path d="M33 155C75 174 126 176 166 155c16-8 29-19 40-33" fill="none" stroke="url(#silver)" stroke-width="8" stroke-linecap="round"/>
    <g fill="url(#silver)" stroke="#5C7393" stroke-width="1.2">
      <path d="M119 145h14v34h-14z"/><path d="M139 132h14v47h-14z"/><path d="M159 114h14v65h-14z"/>
    </g>
    <text x="162" y="65" fill="url(#silver)" stroke="#0A4FC5" stroke-width="1.5" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="900">₺</text>
  </g>

  <line x1="262" y1="38" x2="262" y2="212" stroke="#2563EB" stroke-width="4" opacity=".62"/>

  <text x="300" y="104" fill="url(#blue)" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" letter-spacing="1">BS OFİS</text>
  <text x="300" y="171" fill="url(#silver)" stroke="#325E9C" stroke-width="1.5" font-family="Arial,Helvetica,sans-serif" font-size="63" font-weight="900" letter-spacing="1">BÜTÇE</text>
  <text x="305" y="212" fill="#2563EB" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="850" letter-spacing="11">YÖNETİMİ</text>
</svg>