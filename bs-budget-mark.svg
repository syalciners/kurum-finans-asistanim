<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BS Ofis Bütçe Yönetimi</title>
  <desc id="desc">Mavi ve gümüş BS bütçe uygulama ikonu; grafik ve Türk lirası simgesi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1687F8"/>
      <stop offset=".38" stop-color="#0758CB"/>
      <stop offset="1" stop-color="#082A72"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#EEF4FB"/>
      <stop offset=".7" stop-color="#B8C7D9"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77E7FF"/>
      <stop offset=".48" stop-color="#1687F8"/>
      <stop offset="1" stop-color="#04338D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06245D" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="108" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="102" fill="none" stroke="#70E4FF" stroke-opacity=".76" stroke-width="5"/>
  <path d="M47 129C88 68 165 45 249 46c78 1 150 17 211 53" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="24" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <text x="53" y="317" fill="url(#silver)" stroke="#0A4FC5" stroke-width="4" font-family="Arial,Helvetica,sans-serif" font-size="232" font-weight="900" letter-spacing="-25">BS</text>
    <path d="M89 354C160 388 251 397 324 369c45-17 81-45 112-79" fill="none" stroke="url(#silver)" stroke-width="15" stroke-linecap="round"/>
    <g fill="url(#silver)" stroke="#50709B" stroke-width="2">
      <path d="M292 346h33v60h-33z"/>
      <path d="M337 315h33v91h-33z"/>
      <path d="M382 278h33v128h-33z"/>
    </g>
    <text x="359" y="141" fill="url(#silver)" stroke="#0B54C8" stroke-width="3" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="900">₺</text>
  </g>

  <rect x="18" y="18" width="476" height="476" rx="108" fill="none" stroke="url(#edge)" stroke-width="8"/>
</svg>