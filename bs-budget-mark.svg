<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BS Bütçe Yönetimi</title>
  <desc id="desc">Lacivert zemin üzerinde petrol ve turkuaz finans grafiği, BS harfleri ve altın Türk lirası işareti.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#087F73"/>
      <stop offset="1" stop-color="#10BFA3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C45B"/>
      <stop offset="1" stop-color="#D7A52A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001026" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>
  <rect x="29" y="29" width="454" height="454" rx="102" fill="none" stroke="#10BFA3" stroke-opacity=".42" stroke-width="4"/>
  <path d="M82 346 C158 350 216 329 264 293 C309 259 348 207 416 145" fill="none" stroke="url(#teal)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M388 146h37v37" fill="none" stroke="#10BFA3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="url(#teal)" opacity=".94">
    <rect x="134" y="286" width="34" height="66" rx="9"/>
    <rect x="190" y="248" width="34" height="104" rx="9"/>
    <rect x="246" y="205" width="34" height="147" rx="9"/>
  </g>
  <text x="77" y="276" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="182" font-weight="900" letter-spacing="-18">BS</text>
  <circle cx="369" cy="271" r="57" fill="#14213D" stroke="url(#gold)" stroke-width="10"/>
  <text x="369" y="302" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800">₺</text>
  <text x="256" y="426" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="5">BÜTÇE</text>
</svg>